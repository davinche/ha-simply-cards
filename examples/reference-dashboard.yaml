title: Simply Cards Reference
views:
  - title: Card Reference
    path: reference
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Header and Weather
          - type: custom:echo-header-card
            templates:
              title: Card Reference
            grid_options:
              columns: 12
              rows: 2
          - type: custom:echo-weather-card
            entity: weather.example
            grid_options:
              columns: 12
              rows: 2
      - type: grid
        cards:
          - type: heading
            heading: Control and Sliders
          - type: custom:echo-toggle-card
            entity: light.example
            name: Reading Light
            grid_options:
              columns: 6
              rows: 2
          - type: custom:echo-toggle-card
            entity: fan.example
            name: Ceiling Fan
            slider: true
            grid_options:
              columns: 6
              rows: 3
      - type: grid
        cards:
          - type: heading
            heading: Thermostat and Media
          - type: custom:echo-climate-card
            entity: climate.example
            show_temperature_control: true
            hvac_modes: [cool, heat]
            icon_tap_action:
              action: none
            grid_options:
              columns: 12
              rows: 2
          - type: custom:echo-media-card
            entity: media_player.example
            grid_options:
              columns: 12
              rows: 3
      - type: grid
        cards:
          - type: heading
            heading: Entity and Container
          - type: custom:echo-entity-card
            entity: lock.example
            name: Entry Door
            tap_action:
              action: more-info
            grid_options:
              columns: 6
              rows: 2
          - type: custom:echo-container-card
            title: Entity Controls
            columns: 2
            square: false
            cards:
              - type: custom:echo-entity-card
                entity: light.example
                name: Reading Light
                tap_action:
                  action: toggle
              - type: custom:echo-entity-card
                entity: cover.example
                name: Shade
                tap_action:
                  action: more-info
            grid_options:
              columns: 12
              rows: 3
