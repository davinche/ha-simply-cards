name: Test and build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run check:privacy
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check:release
      - run: npm test
      - run: npm run test:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: ha-simply-cards
          path: dist/ha-simply-cards.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: |
            tests/*.png
            tests/verification-results.json
